# Один серверный ключ используется всеми посетителями, поэтому лимит общий.
limit_req_zone $server_name zone=guardian_api:1m rate=1r/s;

map $arg_page $guardian_page {
  default 1;
  ~^[1-9][0-9]*$ $arg_page;
}

map $args $guardian_limit {
  default 10;
  ~(^|&)page-size=20(&|$) 20;
}

# Формируем upstream-параметры сами: клиент не может подменить ключ, даже кодированным именем.
map $uri $guardian_query {
  default "show-fields=byline,bodyText,thumbnail";
  /guardian-api/search "page=$guardian_page&page-size=$guardian_limit&order-by=newest&show-fields=byline,trailText,thumbnail";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "готово\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /guardian-api/ {
    if ($args ~* "(^|&)api-key=") {
      return 400;
    }

    limit_except GET {
      deny all;
    }
    limit_req zone=guardian_api burst=5;
    limit_req_status 429;

    set $args "$guardian_query&api-key=${GUARDIAN_API_KEY}";

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_set_header Host content.guardianapis.com;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_pass https://content.guardianapis.com/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    # HTML не кешируем, сохраняя наследование защитных заголовков сервера.
    expires epoch;
  }
}
