limit_req_zone $binary_remote_addr zone=guardian_api:10m rate=1r/s;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "готово\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /guardian-api/ {
    if ($args ~* "(^|&)api-key=") {
      return 400;
    }

    limit_except GET {
      deny all;
    }
    limit_req zone=guardian_api burst=5 nodelay;

    set $args "$args&api-key=${GUARDIAN_API_KEY}";

    proxy_ssl_server_name on;
    proxy_set_header Host content.guardianapis.com;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_pass https://content.guardianapis.com/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    # Keep server-level security headers inherited while disabling HTML caching.
    expires epoch;
  }
}
