name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Проверка качества и сборки
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить качество проекта
        run: npm run check

      - name: Проверить уязвимости зависимостей
        run: npm audit --audit-level=high

      - name: Собрать production-образ
        run: docker build --tag posts-showcase:ci .
